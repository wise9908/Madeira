name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Make Scripts Executable & Run Unix Build
        run: |
          chmod -R +x .
          if [ -f "./build/unix/build.sh" ]; then
            ./build/unix/build.sh || true
          fi

      - name: Build Xcode Project
        run: |
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Found project: $PROJ_FILE"
          
          # Run xcodebuild directly without requiring fixed schemes
          xcodebuild build \
            -project "$PROJ_FILE" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=$RUNNER_TEMP/build_out || true

      - name: Package Payload
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          APP_DIR=$(find $RUNNER_TEMP/build_out -name "*.app" -type d | head -n 1)
          
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" $RUNNER_TEMP/Payload/
            cd $RUNNER_TEMP
            zip -r Madeira.ipa Payload
          else
            echo "No .app bundle was compiled."
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: ${{ runner.temp }}/Madeira.ipa
